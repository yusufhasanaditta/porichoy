[project]
name = "porichoy-api"
version = "0.1.0"
description = "Porichoy API: FastAPI + Google ADK agents on Cloud Run"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 110

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
