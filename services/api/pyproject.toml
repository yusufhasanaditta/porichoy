[project]
name = "porichoy-api"
version = "0.1.0"
description = "Porichoy API: FastAPI + Google ADK agents on Cloud Run"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.28.1",
    "selectolax>=1.0.0",
    "pypdf>=6.20.1",
    "google-genai>=2.29.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "reportlab>=5.0.1",
]

[tool.ruff]
line-length = 110

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
